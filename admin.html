<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Tool - EditTruyenPro</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #222; color: #0f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; }
        th { background: #333; color: white; }
        button { cursor: pointer; padding: 5px 10px; }
        .btn-del { background: red; color: white; border: none; }
    </style>
</head>
<body>
    <h1>ADMIN CONTROL PANEL</h1>
    <button onclick="loadKeys()">🔄 Refresh List</button>
    
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Expiration</th>
                <th>Plan</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="key-list">
            </tbody>
    </table>

    <script>
        const API_HOST = "https://edittruyenpro.pages.dev"; // Domain Worker

        async function loadKeys() {
            try {
                // Lưu ý: Worker cần mở endpoint /api/admin/list cho public hoặc thêm header auth
                const res = await fetch(`${API_HOST}/api/admin/list`);
                const data = await res.json();
                
                const tbody = document.getElementById('key-list');
                tbody.innerHTML = '';
                
                // KV List trả về { keys: [{name: "...", metadata: ...}] }
                // Để lấy value chi tiết cần loop fetch get, nhưng demo list trước
                data.keys.forEach(k => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${k.name}</td>
                        <td>-- (Cần fetch detail) --</td>
                        <td>--</td>
                        <td>
                            <button class="btn-del" onclick="deleteKey('${k.name}')">DEL</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                alert('Lỗi kết nối hoặc chưa cấu hình Admin API');
                console.error(e);
            }
        }

        async function deleteKey(keyName) {
            if(confirm('Xóa key ' + keyName + '?')) {
                // Gọi API delete (Cần implement trong Worker)
                alert('Chức năng đang phát triển trong worker');
            }
        }
    </script>
</body>
</html>
